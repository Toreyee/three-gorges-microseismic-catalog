name: full-reproduction

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  full-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz gmt
      - name: Install full Python environment
        run: python -m pip install -e ".[analysis,test,inference]"
      - name: Load all bundled TorchScript models
        run: python scripts/00_verify_models.py --model-dir models/regional --prefix diting --check-companion-pt --load
      - name: Run tests and manuscript-catalog audits
        run: |
          python -m pytest
          python scripts/08_catalog_quality.py --repo-root . --output /tmp/catalog_quality_metrics.json --fail-on-structural-error
          python scripts/10_verify_manuscript_catalog.py --repo-root . --output-dir /tmp/manuscript-catalog --report /tmp/manuscript_catalog_verification.json
      - name: Reproduce Figures 2–8 from manuscript catalog
        run: python scripts/reproduce_figures.py --repo-root . --catalog-mode manuscript --output-dir /tmp/figures --report /tmp/figure_reproduction_report.json
